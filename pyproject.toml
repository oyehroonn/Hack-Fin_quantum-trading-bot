[tool.poetry]
name = "quantum-trading-bot"
version = "0.1.0"
description = "Production-grade quant trading system"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "core"}, {include = "data"}, {include = "features"}, {include = "research"}, {include = "backtest"}, {include = "execution"}, {include = "risk"}, {include = "portfolio"}, {include = "rl"}, {include = "infra"}]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
loguru = "^0.7.2"
numpy = "^1.26.0"
pandas = "^2.1.0"
pyyaml = "^6.0.1"
pyarrow = "^14.0.0"
duckdb = "^0.9.0"
ccxt = "^4.1.0"
yfinance = "^0.2.0"
pytz = "^2023.3"
scipy = "^1.11.0"
scikit-learn = "^1.3.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.1.6"
mypy = "^1.7.0"
pytest = "^7.4.3"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.21.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "DTZ", "T10", "SIM", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "NPY", "RUF"]
ignore = ["E501"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "loguru.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=core --cov=data --cov=features --cov=execution --cov=risk --cov-report=term-missing"
